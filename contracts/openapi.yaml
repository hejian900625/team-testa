openapi: 3.0.3
info:
  title: Agent Workbench API
  version: 0.1.0
  description: >
    「智能体工作台」MVP 接口契约。唯一所有者：架构/契约 Agent。
    前后端对本文件只读，需变更请在任务中提出 issue。
    API 文档以本文件为准；springdoc 注解仅作补充，冲突时以本文件为准。
servers:
  - url: /api/v1
tags:
  - name: agents
    description: 智能体管理
  - name: runs
    description: 运行记录
paths:
  /agents:
    get:
      tags: [agents]
      summary: 分页查询智能体
      operationId: listAgents
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AgentStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentPage' }
    post:
      tags: [agents]
      summary: 创建智能体
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agents/{agentId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [agents]
      summary: 查询智能体详情
      operationId: getAgent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [agents]
      summary: 更新智能体
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [agents]
      summary: 删除智能体
      operationId: deleteAgent
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{agentId}/runs:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [runs]
      summary: 查询某智能体的运行历史（按创建时间倒序）
      operationId: listAgentRuns
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{runId}:
    get:
      tags: [runs]
      summary: 查询运行详情
      operationId: getRun
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    AgentStatus:
      type: string
      enum: [DRAFT, ACTIVE, DISABLED]
      description: DRAFT=草稿, ACTIVE=启用, DISABLED=停用
    RunStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
    Agent:
      type: object
      required: [id, name, model, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 512 }
        model: { type: string, maxLength: 128 }
        systemPrompt: { type: string, maxLength: 8000 }
        tools: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/AgentStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentCreate:
      type: object
      required: [name, model]
      properties:
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 512 }
        model: { type: string, maxLength: 128 }
        systemPrompt: { type: string, maxLength: 8000 }
        tools: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/AgentStatus' }
    AgentUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 512 }
        model: { type: string, maxLength: 128 }
        systemPrompt: { type: string, maxLength: 8000 }
        tools: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/AgentStatus' }
    AgentRun:
      type: object
      required: [id, agentId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RunStatus' }
        input: { type: string }
        output: { type: string }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    AgentPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Agent' } }
    RunPage:
      allOf:
        - { $ref: '#/components/schemas/PageMeta' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AgentRun' } }
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 资源冲突（如名称重复）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
